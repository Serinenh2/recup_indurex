name: CI — Test & Lint

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main]

env:
  DJANGO_SECRET_KEY: ci-secret-key-not-for-production
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DB_ENGINE: django.db.backends.sqlite3

jobs:
  # ── BACKEND : Lint + Test ─────────────────────────────────
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest django
          pip install -r requirements.txt

      - name: Lint (ruff check)
        run: ruff check . --exclude venv,.venv,__pycache__,migrations

      - name: Vérifier le formatage (ruff format --check)
        run: ruff format --check . --exclude venv,.venv,__pycache__,migrations

      - name: Tests Django (pytest)
        run: python -m pytest
        env:
          SENTRY_DSN: ""

  # ── FRONTEND : TypeScript + Build ─────────────────────────
  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: TypeScript (tsc)
        run: npx tsc --noEmit
        continue-on-error: true  # Ne pas bloquer si des types sont incomplets

      - name: Build (vite)
        run: npm run build
        env:
          VITE_SENTRY_DSN: ""

  # ── DOCKER : Build des images (sans push) ─────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build image backend
        run: docker build -t recup-backend:ci ./backend

      - name: Build image frontend
        run: docker build -t recup-frontend:ci ./frontend
        env:
          VITE_SENTRY_DSN: ""
