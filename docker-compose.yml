version: "3.9"

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks:
    - app-network

services:
  # ── Database ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    <<: *app-defaults
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-recup_indurex}
      POSTGRES_USER: ${DB_USER:-recup_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recup_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-recup_user} -d ${DB_NAME:-recup_indurex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Django Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *app-defaults
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
      - backend_logs:/app/logs
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,nginx
      DJANGO_CORS_ALLOWED_ORIGINS: https://your-domain.com
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; resp=urllib.request.urlopen('http://localhost:8000/api/auth/token/', timeout=5); assert resp.status < 500"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Nginx (Reverse Proxy + Frontend) ─────────────────────
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    <<: *app-defaults
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_static:/static:ro
      - backend_media:/media:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Admin: Run migrations on startup ─────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    <<: *app-defaults
    entrypoint: ["sh", "-c"]
    command: >
      "python manage.py migrate --noinput &&
       python manage.py loaddata initial_data --app accounts --format json 2>/dev/null || true"
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - setup

volumes:
  postgres_data:
    driver: local
  backend_media:
    driver: local
  backend_static:
    driver: local
  backend_logs:
    driver: local

networks:
  app-network:
    driver: bridge
